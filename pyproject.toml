[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asrq"
version = "0.1.0"
description = "ASR Quantization toolkit"
requires-python = ">=3.8"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
]

[project.optional-dependencies]
# HadaCore: tensor-core fast Hadamard transform used by the online rotations.
# Needs a CUDA toolkit and must be installed with --no-build-isolation so the build
# can see the already-installed torch.
hadacore = [
    "faster_hadamard_transform @ git+https://github.com/pytorch-labs/applied-ai.git#subdirectory=kernels/cuda/inference/hadamard_transform",
]

[project.scripts]
asrq-exp = "asrq.exp:main"

[tool.setuptools.packages.find]
include = ["asrq*"]

[tool.setuptools.package-data]
asrq = ["configs/**/*.yaml"]
