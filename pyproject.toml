[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "asrq"
version = "0.1.0"
description = "ASR Quantization toolkit"
requires-python = ">=3.12"
dependencies = [
    "hydra-core>=1.3",
    "omegaconf>=2.3",
    # Quantized GEMM kernels, and the fused input Hadamard used by the online rotations.
    # Imported at module scope by asrq.transforms.rotation.utils, so it is required even
    # for the norm-folding utilities. JIT-compiles its kernels on first use, which needs
    # ninja on PATH and a CUDA toolkit.
    "humming-kernels>=0.1.13",
]

[project.optional-dependencies]
# Two separate CUDA kernels for the same Hadamard transform; pick one for the online
# rotations. Both build from source, need a CUDA toolkit, and must be installed with
# --no-build-isolation so the build sees the already-installed torch. Setting
# TORCH_CUDA_ARCH_LIST to just the target arch (e.g. "8.6") keeps the build to minutes.
#
# Whichever is used online determines what must be absorbed into the weight, so a kernel
# swap requires re-absorbing unless the two are verified to produce the same matrix.

# Dao-AILab kernel, as used by QuaRot and SpinQuant. Verified to match the pure-torch
# matmul_hadU in hadamard_utils.py to ~6e-10, and to run at the memory-bandwidth floor.
fast-hadamard = [
    "fast_hadamard_transform @ git+https://github.com/Dao-AILab/fast-hadamard-transform.git",
]

# HadaCore: tensor-core fast Hadamard transform.
hadacore = [
    "faster_hadamard_transform @ git+https://github.com/pytorch-labs/applied-ai.git#subdirectory=kernels/cuda/inference/hadamard_transform",
]

[project.scripts]
asrq-exp = "asrq.exp:main"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pinned explicitly rather than extended: ruff's default rule set varies between versions.
# E501/W291/W293 (line length, trailing whitespace) are not on by default.
select = ["E4", "E7", "E9", "F", "E501", "W291", "W293"]

[tool.setuptools.packages.find]
include = ["asrq*"]

[tool.setuptools.package-data]
asrq = ["configs/**/*.yaml"]

[tool.pytest.ini_options]
markers = [
    "integration: runs a real model through rot-exp.py/exp.py at small scale; needs a GPU and cached models (deselect with -m 'not integration')",
]
