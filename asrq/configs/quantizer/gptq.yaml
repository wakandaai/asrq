name: gptq
bits: 4
group_size: 128
block_size: 128
symmetric: True
percdamp: 0.01
# Bits for the Linear a rotation inserts after each Conformer block's output norm, when the model config quantizes
# it (model.quantize_block_output_linear). null gives it the same bits as the rest; its error lands straight in the
# residual stream and nothing downstream corrects it, so it can be worth keeping wider.
block_output_linear_bits: null
# Give every quantized layer a transformer block's norms feed a per-input-channel scale, fitted inside GPTQ as each
# column is rounded and folded into that norm (asrq/quantizers/scale_recovery.py; weight error only).
# scale_recovery_ridge pulls s toward 1.
scale_recovery: False
scale_recovery_ridge: 0.01
# How the layers a norm feeds share s: lockstep (quantized as one stacked matrix, one s fitted over all their
# rows) or average (each layer quantized alone, then the column-energy weighted average of their scales).
scale_recovery_method: lockstep
# Weight recovery: after each Conformer block's GPTQ, refit the weight and bias of its output linear layer (the
# identity Linear a rotation inserts after the block's output norm) in closed form, so the quantized block
# reproduces the full-precision block's output; see asrq/quantizers/weight_recovery.py. Transformer blocks have no
# such layer and are recovered by scale recovery instead. Independent of it; weight_recovery_ridge pulls toward the
# current weights.
weight_recovery: False
weight_recovery_ridge: 0.01
# The same refit on every quantized layer, each one just before it is quantized, with the full-precision
# output coming from a copy of its block taken before any of it was quantized; see ModelQ.layer_recovery.
# Independent of weight_recovery, which keeps correcting a Conformer block's whole error at its output
# layer. This costs two extra block passes over the calibration set per recovered layer, and skips the
# layers no quantized layer feeds yet, where the refit is the identity. It also makes each block quantize
# its layers in the order they run rather than the order they are defined, so that every layer is refit
# against the drift of everything feeding it; see ModelQ.in_execution_order.
layer_weight_recovery: False
layer_weight_recovery_ridge: 0.01
