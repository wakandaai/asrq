name: rotation
num_samples: 800
epochs: 1
learning_rate: 0.01
batch_size: 4
path: ""
learn_rotation: False
hadamard_block_size: 128
# random +-1 signs before the fc2 online Hadamard (X @ D @ H); a plain Hadamard spikes GELU outputs.
# Saved as one seed; humming (third_party/humming) generates the signs from it inside its kernel.
hadamard_random_signs: True
# learn a head-wise R2 per attention module (False: R1 only, attn_out input unrotated)
learn_r2: True
# online Hadamard on every fc2 input (False: fc2 input unrotated)
fc2_online_hadamard: True
# What the search minimises: ce (the model's training loss on the calibration transcripts), kl (the divergence
# from the full-precision model's logits, which costs a teacher pass) or auto, which is ce for Cayley SGD and kl
# for the evolutionary search, the only objective it supports.
objective: auto
# 0: full-width R1; otherwise block-diagonal R1 with this block width (use the group size)
r1_block_size: 0
use: True
# How rot-exp.py searches the rotation. cayley: R1 and a head-wise R2 per attention module, from random
# Hadamard matrices, with Cayley SGD (epochs, learning_rate, batch_size, num_samples). evolution: R1 as
# diag(s1) @ H @ diag(s2), a (1 + lambda) evolutionary search over the sign vectors with three-stage
# selection; R2 stays a random Hadamard. Fitness is the KL objective on num_samples calibration samples, in
# batches of batch_size. See asrq/transforms/rotation/hadamard_search.py.
search: cayley
# Weight-only quantization: search R1 (search: evolution only) against the quantizer's rounded weights instead of
# quantized activations. Each candidate is folded into the weights, which are rounded with RTN at the quantizer's
# bits, group size and symmetry; activations stay in full precision and activation_bits is ignored by the search.
# Refuse to apply a rotation whose checkpoint records other quantization settings than this run uses (the
# activation bits, group size, symmetry and group-wise roles it was searched against, and the weight grid of a
# weight-only search). false applies it anyway.
check_settings: True
# Autocast dtype of the evolutionary search's forward passes, teacher and student alike, so the KL sees only
# quantization error: float32, bfloat16 or float16. The search's batches are also grouped by audio length, which
# cuts the padding the model computes on; the verification passes stay in float32.
fitness_dtype: float32
weight_only: False
# How the weight-only search quantizes each candidate's weights: rtn, gptq (on Hessians collected once; the
# residual-stream layers' Hessians are rotated per candidate), or null for the experiment's quantizer.
weight_only_quantizer: null
evolution:
  # whisper-large-v3, 64 samples, float32: ~150 s per generation, so 8 generations ~ Cayley SGD's 200 steps (~19 min)
  generations: 8
  # children per generation. No two children of a generation are the same, and no child repeats a candidate an
  # earlier generation scored.
  offspring: 32
  # selection stages per generation; 1 scores every child once on the whole set, so the best of them is chosen
  # exactly, and more stages spend most of the budget on the few children that reach the last one.
  stages: 3
  # children kept after each stage but the last, so stages - 1 numbers; a longer list is truncated
  survivors: [4, 2]
  # samples scored in each stage; null: 8/16/N for N <= 64, 16/32/N for N <= 128, 8/64/N for N <= 256,
  # 16/64/N above
  stage_samples: null
  # sign positions flipped per child. mutate: s1_s2 draws them from both sign vectors, s1 from s1 only, auto
  # picks s1 when activation_symmetric (s2 then does not change the fitness) and s1_s2 when asymmetric
  flips: 2
  # children per generation drawn at random instead of mutated from the parent, the last ones of the batch; below
  # 1 it is a fraction of offspring, so 0.5 splits the generation in half. A random child is a restart, not a
  # step: it is accepted only by beating the parent on the full set, so it costs one candidate and guards against
  # an unlucky starting point. 0 turns it off.
  random_offspring: 0.5
  mutate: auto
  seed: 0
  # keep the full-precision logits of every batch on the CPU instead of recomputing them per candidate
  cache_teacher: True
