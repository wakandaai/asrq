name: nvidia/parakeet-ctc-1.1b

# Quantization settings
exclude_modules: []
# A rotation inserts an identity Linear after every Conformer block's output norm (but the last) to
# carry that norm's scale and shift. True also weight- and activation-quantizes it (role block_out,
# per token unless listed in activation_groupwise_roles), in the rotation search, GPTQ/RTN,
# evaluation and humming ASRQLinear conversion; False keeps it in full precision.
quantize_block_output_linear: False

# evaluation
eval_batch_size: 192
# Function in asrq/evaluation/openasr.py that transcribes during evaluation:
#   generate_parakeet              NeMo transcribe, eager
#   generate_parakeet_cuda_graphs  the same greedy CTC transcription with the encoder and CTC head
#                                  replayed from CUDA graphs (audio padded to 5 s buckets, one graph per
#                                  batch size and bucket). Faster at small batch sizes and needed there for
#                                  humming ASRQLinear models; no gain at large batch, where the encoder is
#                                  GPU-bound. Pair humming models with eval_dtype: float16.
generate_fn: generate_parakeet
